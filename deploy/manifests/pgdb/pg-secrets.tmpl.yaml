apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP1_NAME}-pgdb-superuser-credentials
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: pgdb
    tier: data
spec:
  refreshInterval: 0h00m30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_ROOT_NAMESPACE}-azure-key-vault
    namespace: ${APP_ENV}

  target:
    name: ${APP1_NAME}-pgdb-superuser
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Crucial for letting CNPG know it needs to reload if passwords rotate
          cnpg.io/reload: "true"

  data:
    # name of the SECRET in the Azure KV (no prefix is by default a SECRET)
    - secretKey: username
      remoteRef:
        key: secret/${APP1_NAME}-${APP_ENV}-pgdb-${AZ_LOCATION}
        property: superuser_username

    # explicit type and name of secret in the Azure KV
    - secretKey: password
      remoteRef:
        key: secret/${APP1_NAME}-${APP_ENV}-pgdb-${AZ_LOCATION}
        property: superuser_password
---
