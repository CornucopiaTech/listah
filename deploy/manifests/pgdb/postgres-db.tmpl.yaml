apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ${APP1_NAME}-pgdb-db
  namespace: ${APP_ENV}
  labels:
    app.kubernetes.io/name: ${APP1_NAME}-pgdb-db
    app.kubernetes.io/version: "18.0"
    app.kubernetes.io/component: database-instance
    app.kubernetes.io/part-of: ${APP1_NAME}
    app.kubernetes.io/layer: data
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: pgdb
    tier: data
spec:
  name: ${APP1_NAME}-pgdb-instance # The actual name of the database in Postgres
  owner: app # The database owner role
  cluster:
    name: ${APP1_NAME}-pgdb-cluster # Name of your target CloudNativePG Cluster
