apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: ${K8_NAMESPACE}-pgdb-db
  namespace: ${K8_NAMESPACE}
  labels:
    app.kubernetes.io/name: ${K8_NAMESPACE}-pgdb-db
    app.kubernetes.io/version: "18.0"
    app.kubernetes.io/component: database-instance
    app.kubernetes.io/part-of: ${K8_NAMESPACE}
    app.kubernetes.io/layer: data
    # app.kubernetes.io/managed-by: Helm
spec:
  name: ${K8_NAMESPACE}-pgdb-instance # The actual name of the database in Postgres
  owner: app # The database owner role
  cluster:
    name: ${K8_NAMESPACE}-pgdb-cluster # Name of your target CloudNativePG Cluster
