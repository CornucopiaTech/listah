apiVersion: batch/v1
kind: Job
metadata:
  name: ${APP1_NAME}-pgdb-db-schema-mutation
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: pgdb
    tier: data
spec:
  template:
    spec:
      containers:
        - name: ${APP1_NAME}-pgdb-db-schema-mutation
          image: "${APP1_DB_IMAGE_URL}"
          env:
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${APP1_NAME}-pgdb-admin-role
                  key: username
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${APP1_NAME}-pgdb-admin-role
                  key: password
            - name: DATABASE_DIALECT
              value: postgresql
            - name: DATABASE_NAME
              value: ${APP1_NAME}-pgdb-instance
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_HOST
              value: ${APP1_NAME}-pgdb-cluster-rw
            - name: LIQUIBASE_COMMAND_URL
              value: jdbc:$(DATABASE_DIALECT)://$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)
      restartPolicy: Never
      # restartPolicy: OnFailure
  backoffLimit: 4
