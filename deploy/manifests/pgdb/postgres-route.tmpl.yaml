apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: "${K8_NAMESPACE}-pgdb-tcp-route"
  namespace: ${K8_NAMESPACE}
spec:
  parentRefs:
    - name: "${K8_NAMESPACE}-gateway"
      namespace: ${K8_NAMESPACE}
  hostnames:
    - "db.${K8_NAMESPACE}.${ROOT_ZONE_NAME}"
  rules:
    - backendRefs:
        - name: ${K8_NAMESPACE}-pgdb
          port: 5432
