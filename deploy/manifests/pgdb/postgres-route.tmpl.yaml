apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: "${APP1_NAME}-pgdb-tcp-route"
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: pgdb
    tier: data
spec:
  parentRefs:
    - name: "${K8_ROOT_NAMESPACE}-gateway"
      namespace: ${APP_ENV}
  hostnames:
    - "db.${APP1_NAME}.${ROOT_ZONE_NAME}"
  rules:
    - backendRefs:
        - name: ${APP1_NAME}-pgdb
          port: 5432
