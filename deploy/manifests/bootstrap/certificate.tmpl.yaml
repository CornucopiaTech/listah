# certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${APP1_NAME}-${APP_ENV}-tls"
  namespace: "${APP1_NAME}"
spec:
  secretName: "${APP1_NAME}-${APP_ENV}-tls"
  privateKey:
    rotationPolicy: Always
  commonName: ${APP1_NAME}.${ROOT_ZONE_NAME}
  dnsNames:
    - www.${APP1_NAME}.${ROOT_ZONE_NAME}
    - www.api.${APP1_NAME}.${ROOT_ZONE_NAME}
    - www.web.${APP1_NAME}.${ROOT_ZONE_NAME}
    - ${APP1_NAME}.${ROOT_ZONE_NAME}
    - api.${APP1_NAME}.${ROOT_ZONE_NAME}
    - web.${APP1_NAME}.${ROOT_ZONE_NAME}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: "${K8_ROOT_NAMESPACE}-${APP_ENV}-letsencrypt"
    kind: ClusterIssuer
