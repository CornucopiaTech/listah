apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${K8_SERVICE_ACCOUNT_NAME}
  namespace: ${K8_NAMESPACE}
  annotations:
    azure.workload.identity/client-id: ${K8_MANAGED_IDENTITY_CLIENT_ID}
    azure.workload.identity/tenant-id: ${K8_MANAGED_IDENTITY_TENANT_ID}
  labels:
    azure.workload.identity/use: "true"
