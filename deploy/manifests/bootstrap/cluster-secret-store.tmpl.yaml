apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ${K8_NAMESPACE}-azure-key-vault
  namespace: ${K8_NAMESPACE}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "${AZ_VAULT_URI}"
      serviceAccountRef:
        name: ${K8_SERVICE_ACCOUNT_NAME}
