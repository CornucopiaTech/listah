apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: ExternalDNS
metadata:
  name: "${K8_NAMESPACE}-dns"
  namespace: "${K8_NAMESPACE}"
spec:
  resourceName: "${K8_NAMESPACE}-dns"
  resourceNamespace: "${K8_NAMESPACE}"
  dnsZoneResourceIDs:
    - "${PUBLIC_ZONE_ID}"
  resourceTypes:
    - gateway
  identity:
    type: workloadIdentity
    serviceAccount: "${K8_SERVICE_ACCOUNT_NAME}"
