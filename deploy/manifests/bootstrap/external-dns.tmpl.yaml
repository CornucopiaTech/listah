apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: ExternalDNS
metadata:
  name: "${APP1_NAME}-dns"
  namespace: "${APP1_NAME}"
spec:
  resourceName: "${APP1_NAME}-dns"
  resourceNamespace: "${APP1_NAME}"
  dnsZoneResourceIDs:
    - "${PUBLIC_ZONE_ID}"
  resourceTypes:
    - gateway
  identity:
    type: workloadIdentity
    serviceAccount: "${K8_SERVICE_ACCOUNT_NAME}"
