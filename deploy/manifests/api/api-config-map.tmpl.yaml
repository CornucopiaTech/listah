apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP1_NAME}-api-configmap
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: api
    tier: backend
data:
  LOG_LEVEL: "INFO"
  ENV: "${APP_ENV}"
  PORT: "80"
  APP_PORT: "80"
  APP_NAME: "${APP1_NAME}"
  ALLOWED_ORIGINS: "1,2"
  DATABASE_DB: "${APP1_NAME}-pgdb-instance"
  DATABASE_HOST: "${APP1_NAME}-pgdb-cluster-rw.${APP_ENV}.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_USE_TLS: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "DEBUG"
  OLTP_EXPORTER_TYPE: "otlp"
  METRIC_FREQ_SEC: "60"
  TRACE_FREQ_SEC: "1"
