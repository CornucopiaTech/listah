apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP1_NAME}-api-auth-credentials
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: api
    tier: backend
spec:
  refreshInterval: 0h30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_ROOT_NAMESPACE}-azure-key-vault
  target:
    name: ${APP1_NAME}-api-auth
    creationPolicy: Owner
  data:
    # name of the SECRET in the Azure KV (no prefix is by default a SECRET)
    - secretKey: domain
      remoteRef:
        key: secret/${APP1_NAME}-${APP_ENV}-api-auth-secrets-${AZ_LOCATION}
        property: domain

    # explicit type and name of secret in the Azure KV
    - secretKey: auth_api_key
      remoteRef:
        key: secret/${APP1_NAME}-${APP_ENV}-api-auth-secrets-${AZ_LOCATION}
        property: auth_api_key
