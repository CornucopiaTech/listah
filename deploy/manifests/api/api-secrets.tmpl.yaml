apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${K8_NAMESPACE}-api-auth-credentials
  namespace: ${K8_NAMESPACE}
spec:
  refreshInterval: 0h30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_NAMESPACE}-azure-key-vault

  target:
    name: ${K8_NAMESPACE}-api-auth
    creationPolicy: Owner
  data:
    # name of the SECRET in the Azure KV (no prefix is by default a SECRET)
    - secretKey: domain
      remoteRef:
        key: secret/${K8_NAMESPACE}-api-auth-secrets-${APP_ENV}
        property: domain

    # explicit type and name of secret in the Azure KV
    - secretKey: auth_api_key
      remoteRef:
        key: secret/${K8_NAMESPACE}-api-auth-secrets-${APP_ENV}
        property: auth_api_key
