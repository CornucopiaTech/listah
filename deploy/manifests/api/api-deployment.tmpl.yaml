apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${K8_NAMESPACE}-api-deployment
  namespace: ${K8_NAMESPACE}
  labels:
    app: ${K8_NAMESPACE}-api
spec:
  replicas: 2 # Number of identical containers to run
  selector:
    matchLabels:
      app: ${K8_NAMESPACE}-api
  template:
    metadata:
      labels:
        app: ${K8_NAMESPACE}-api
    spec:
      containers:
        - name: ${K8_NAMESPACE}-api-container
          image: "${API_IMAGE_URL}" # Your Docker image
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 443
          envFrom:
            - configMapRef:
                name: ${K8_NAMESPACE}-api-configmap
          env:
            - name: TLS_CERT
              value: /etc/tls/tls.crt
            - name: TLS_KEY
              value: /etc/tls/tls.key
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-pgdb-rw-role
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-pgdb-rw-role
                  key: password
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-api-auth
                  key: auth_api_key
            - name: AUTH_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-api-auth
                  key: domain
      volumes:
        - name: tls
          secret:
            secretName: "${K8_NAMESPACE}-${APP_ENV}-tls"
