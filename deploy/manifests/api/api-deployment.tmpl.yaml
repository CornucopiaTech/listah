apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP1_NAME}-api-deployment
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: api
    tier: backend
spec:
  replicas: 1 # Number of identical containers to run
  selector:
    matchLabels:
      app: ${APP1_NAME}
      env: ${APP_ENV}
      target: api
      tier: backend
  template:
    metadata:
      labels:
        app: ${APP1_NAME}
        env: ${APP_ENV}
        target: api
        tier: backend
    spec:
      containers:
        - name: ${APP1_NAME}-api-container
          image: "${APP1_API_IMAGE_URL}" # Your Docker image
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 443
          envFrom:
            - configMapRef:
                name: ${APP1_NAME}-api-configmap
          env:
            - name: TLS_CERT
              value: /etc/tls/tls.crt
            - name: TLS_KEY
              value: /etc/tls/tls.key
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ${APP1_NAME}-pgdb-rw-role
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${APP1_NAME}-pgdb-rw-role
                  key: password
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: ${APP1_NAME}-api-auth
                  key: auth_api_key
            - name: AUTH_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: ${APP1_NAME}-api-auth
                  key: domain
      volumes:
        - name: tls
          secret:
            secretName: "${APP1_NAME}-${APP_ENV}-tls"
