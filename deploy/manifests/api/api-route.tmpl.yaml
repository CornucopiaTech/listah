apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "${APP1_NAME}-api-sub-http-route"
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: api
    tier: backend
spec:
  parentRefs:
    - name: "${K8_ROOT_NAMESPACE}-gateway"
      namespace: ${APP_ENV}
  hostnames:
    - "api.${APP1_NAME}.${ROOT_ZONE_NAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${APP1_NAME}-api-svc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "${APP1_NAME}-api-http-route"
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: api
    tier: backend
spec:
  parentRefs:
    - name: "${K8_ROOT_NAMESPACE}-gateway"
      namespace: ${APP_ENV}
  hostnames:
    - "${APP1_NAME}.${ROOT_ZONE_NAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ${APP1_NAME}-api-svc
          port: 80
---
