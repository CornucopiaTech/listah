apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${K8_NAMESPACE}-postgres-superuser-credentials
  namespace: ${K8_NAMESPACE}
spec:
  refreshInterval: 0h30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_NAMESPACE}-azure-key-vault

  target:
    name: ${K8_NAMESPACE}-pg-superuser
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Crucial for letting CNPG know it needs to reload if passwords rotate
          cnpg.io/reload: "true"

  data:
    # name of the SECRET in the Azure KV (no prefix is by default a SECRET)
    - secretKey: username
      remoteRef:
        key: secret/${K8_NAMESPACE}-pgdb-superuser-username-${APP_ENV}

    # explicit type and name of secret in the Azure KV
    - secretKey: password
      remoteRef:
        key: secret/${K8_NAMESPACE}-pgdb-superuser-password-${APP_ENV}
---
