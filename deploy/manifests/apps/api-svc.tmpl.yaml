apiVersion: v1
kind: Service
metadata:
  name: ${K8_NAMESPACE}-api-svc
  namespace: ${K8_NAMESPACE}
spec:
  type: ClusterIP # Keeps the service internal. Change to 'LoadBalancer' if on AWS/GCP/Azure and you need external access.
  selector:
    app: ${K8_NAMESPACE}-api # Must match the Deployment's matchLabels
  ports:
    - protocol: TCP
      port: 9090 # The port the service exposes inside the cluster
      targetPort: ${APP_PORT} # The port the container is listening on
