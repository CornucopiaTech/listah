apiVersion: v1
kind: ConfigMap
metadata:
  name: ${APP1_NAME}-web-configmap
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
data:
  LOG_LEVEL: "INFO"
  ENV: "${APP_ENV}"
  APP_NAME: "${APP1_NAME}"
  API_URL: "${APP1_NAME}-api-svc.${APP1_NAME}.svc"
  DEBUG: "False"
