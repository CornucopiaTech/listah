apiVersion: v1
kind: Service
metadata:
  name: ${APP1_NAME}-web-svc
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
spec:
  type: ClusterIP # Keeps the service internal. Change to 'LoadBalancer' if on AWS/GCP/Azure and you need external access.
  selector: # Must match the Deployment's matchLabels
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
  ports:
    - name: http
      # protocol: TCP
      port: 80 # The port the service exposes inside the cluster
      targetPort: http # The port the container is listening on
    - name: https
      # protocol: TCP
      port: 443 # The port the service exposes inside the cluster
      targetPort: https # The port the container is listening on
