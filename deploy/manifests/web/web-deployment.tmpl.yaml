apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP1_NAME}-web-deployment
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
spec:
  replicas: 2 # Number of identical containers to run
  selector:
    matchLabels:
      app: ${APP1_NAME}
      env: ${APP_ENV}
      target: web
      tier: frontend
  template:
    metadata:
      labels:
        app: ${APP1_NAME}
        env: ${APP_ENV}
        target: web
        tier: frontend
    spec:
      containers:
        - name: ${APP1_NAME}-web-container
          image: "${APP1_WEB_IMAGE_URL}" # Your Docker image
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 443
          envFrom:
            - configMapRef:
                name: ${APP1_NAME}-web-configmap
          env:
            - name: TLS_CERT
              value: /etc/tls/tls.crt
            - name: TLS_KEY
              value: /etc/tls/tls.key
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: ${APP1_NAME}-web-auth
                  key: auth_web_key
      volumes:
        - name: tls
          secret:
            secretName: "${APP1_NAME}-${APP_ENV}-tls"
