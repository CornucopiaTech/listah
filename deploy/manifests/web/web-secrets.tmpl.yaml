apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${K8_NAMESPACE}-web-auth-credentials
  namespace: ${K8_NAMESPACE}
spec:
  refreshInterval: 0h30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_NAMESPACE}-azure-key-vault

  target:
    name: ${K8_NAMESPACE}-web-auth
    creationPolicy: Owner
  data:
    # explicit type and name of secret in the Azure KV
    - secretKey: auth_web_key
      remoteRef:
        key: secret/${K8_NAMESPACE}-web-auth-secrets-${APP_ENV}
        property: auth_web_key
