apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP1_NAME}-web-auth-credentials
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
spec:
  refreshInterval: 0h30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_ROOT_NAMESPACE}-azure-key-vault

  target:
    name: ${APP1_NAME}-web-auth
    creationPolicy: Owner
  data:
    # explicit type and name of secret in the Azure KV
    - secretKey: auth_web_key
      remoteRef:
        key: secret/${APP1_NAME}-${APP_ENV}-web-auth-secrets-${AZ_LOCATION}
        property: auth_web_key
