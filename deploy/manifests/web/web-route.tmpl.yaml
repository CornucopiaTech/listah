apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "${APP1_NAME}-web-sub-http-route"
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
spec:
  parentRefs:
    - name: "${K8_ROOT_NAMESPACE}-gateway"
      namespace: ${APP_ENV}
  hostnames:
    - "web.${APP1_NAME}.${ROOT_ZONE_NAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${APP1_NAME}-web-svc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "${APP1_NAME}-web-http-route"
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
spec:
  parentRefs:
    - name: "${K8_ROOT_NAMESPACE}-gateway"
      namespace: ${APP_ENV}
  hostnames:
    - "${APP1_NAME}.${ROOT_ZONE_NAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /web
      backendRefs:
        - name: ${APP1_NAME}-web-svc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "${APP1_NAME}-http-route"
  namespace: ${APP_ENV}
  labels:
    app: ${APP1_NAME}
    env: ${APP_ENV}
    target: web
    tier: frontend
spec:
  parentRefs:
    - name: "${K8_ROOT_NAMESPACE}-gateway"
      namespace: ${APP_ENV}
  hostnames:
    - "${APP1_NAME}.${ROOT_ZONE_NAME}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ${APP1_NAME}-web-svc
          port: 80
---
