apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${K8_NAMESPACE}-postgres-superuser-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_NAMESPACE}-azure-key-vault

  target:
    name: ${K8_NAMESPACE}-pg-superuser
    creationPolicy: Owner

  data:
    # name of the SECRET in the Azure KV (no prefix is by default a SECRET)
    - secretKey: username
      remoteRef:
        key: secret/"${APP_NAME}-pgdb-superuser-username-${APP_ENV}"

    # explicit type and name of secret in the Azure KV
    - secretKey: password
      remoteRef:
        key: secret/"${APP_NAME}-pgdb-superuser-password-${APP_ENV}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${K8_NAMESPACE}-postgres-user-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: ${K8_NAMESPACE}-azure-key-vault

  target:
    name: ${K8_NAMESPACE}-pg-user
    creationPolicy: Owner

  data:
    # name of the SECRET in the Azure KV (no prefix is by default a SECRET)
    - secretKey: username
      remoteRef:
        key: secret/"${APP_NAME}-pgdb-username-${APP_ENV}"

    # explicit type and name of secret in the Azure KV
    - secretKey: password
      remoteRef:
        key: secret/"${APP_NAME}-pgdb-password-${APP_ENV}"
