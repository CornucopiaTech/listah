apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: listah
  namespace: argocd
  # Finalizer that ensures that project is not deleted until it is not referenced by any application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    team: listah
    environment: prod
    managed-by: argocd
spec:
  # Project description
  description: "Guardrails for Listah Project"

  # Allow manifests to deploy from any Git repos
  sourceRepos:
    - "https://github.com/CornucopiaTech/listah.git"
    - "https://github.com/CornucopiaTech/commons.git"

  # Only permit applications to deploy to the 'listah' namespace or any namespace starting with 'listah-' in the same cluster
  # Destination clusters can be identified by 'server', 'name', or both.
  destinations:
    - namespace: listah
      server: https://kubernetes.default.svc
    # Destinations also allow wildcard globbing
    - namespace: listah-*
      server: https://kubernetes.default.svc

  # Deny all cluster-scoped resources from being created, except for Namespace
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      # Name is optional. If specified, only resources with a matching name will be allowed.
      # Globs in Go's filepath.Match syntax are supported. Example: "team1-*".
      name: "listah-*"
    - group: ""
      kind: PersistentVolume
      # Name is optional. If specified, only resources with a matching name will be allowed.
      # Globs in Go's filepath.Match syntax are supported. Example: "team1-*".
      name: "listah-*"

  # Deny all Namespace resources from being created if their name starts with 'kube-'
  clusterResourceBlacklist:
    - group: ""
      kind: Namespace
      # Name is optional. If specified, only resources with a matching name will be denied.
      name: "kube-*"

  # Allow all namespaced-scoped resources to be created, except for ResourceQuota, LimitRange, NetworkPolicy
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: ""
      kind: NetworkPolicy
    - group: ""
      kind: Role
    - group: ""
      kind: RoleBinding
    - group: ""
      kind: ServiceAccount

  # Deny all namespaced-scoped resources from being created, except for Deployment and StatefulSet
  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: "apps"
      kind: StatefulSet
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service

  # Enables namespace orphaned resource monitoring.
  orphanedResources:
    warn: true

  roles:
    # A role which provides read-only access to all applications in the project
    - name: read-only
      description: Read-only privileges to listah
      policies:
        - p, proj:listah:read-only, applications, get, listah/*, allow
      groups:
        - listah-read-only

    # A role which provides developer access to all applications in the project
    - name: developer
      description: developer privileges to listah
      policies:
        - p, proj:listah:developer, applications, get, listah/*, allow
      groups:
        - listah-developer

    # A role which provides admin access to all applications in the project
    - name: admin
      description: admin privileges to listah
      policies:
        - p, *, *, *, *, allow
      groups:
        - listah-admin

    # A role which provides sync privileges to only the listah-dev application, e.g. to provide
    # sync privileges to a CI system
    - name: ci
      description: Sync privileges for listah
      policies:
        - p, proj:listah:ci, applications, sync, listah/*, allow

  # Sync windows restrict when Applications may be synced. https://argo-cd.readthedocs.io/en/stable/user-guide/sync_windows/
  syncWindows:
    - kind: allow
      schedule: "* * * * *"
      timeZone: America/New_York
      duration: 1h
      applications:
        - "listah-*"
      namespaces:
        - listah
      clusters:
        - in-cluster
      manualSync: true
      syncOverrun: true # Syncs started during this window can continue after window ends
  # By default, apps may sync to any cluster specified under the `destinations` field, even if they are not
  # scoped to this project. Set the following field to `true` to restrict apps in this cluster to only clusters
  # scoped to this project.
  permitOnlyProjectScopedClusters: true

  # When using Applications-in-any-namespace, this field determines which namespaces this AppProject permits
  # Applications to reside in. Details: https://argo-cd.readthedocs.io/en/stable/operator-manual/app-any-namespace/
  sourceNamespaces:
    - "argocd-apps-*"
