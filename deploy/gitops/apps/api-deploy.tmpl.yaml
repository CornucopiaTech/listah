apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${K8_NAMESPACE}-api-deployment
  namespace: ${K8_NAMESPACE}
  labels:
    app: ${K8_NAMESPACE}-api
spec:
  replicas: 2 # Number of identical containers to run
  selector:
    matchLabels:
      app: ${K8_NAMESPACE}-api
  template:
    metadata:
      labels:
        app: ${K8_NAMESPACE}-api
    spec:
      containers:
        - name: ${K8_NAMESPACE}-api-container
          image: "${API_IMAGE_URL}" # Your Docker image
          ports:
            - containerPort: ${APP_PORT} # The port your app listens on
          envFrom:
            - configMapRef:
                name: ${K8_NAMESPACE}-api-configmap
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-pg-rw-role
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-pg-rw-role
                  key: password
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-api-auth
                  key: auth_api_key
            - name: AUTH_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: ${K8_NAMESPACE}-api-auth
                  key: domain
