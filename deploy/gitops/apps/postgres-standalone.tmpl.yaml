apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: postgres
spec:
  instances: 1 # one Postgres server, no replicas

  imageName: ghcr.io/cloudnative-pg/postgresql:17 # choose a currently supported major version

  bootstrap:
    initdb:
      database: appdb
      owner: app
      secret:
        name: app-user-secret # the Secret from Step 7

  storage:
    size: 20Gi
    storageClass: azure-storage-retained

  resources: # always set these on a database
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 2Gi

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB" # roughly 25% of memory
