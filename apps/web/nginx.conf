server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;   # don't build redirects with the internal host/port

  # Hashed build assets: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Runtime config and index.html: never cache
  location = /config.js {
    add_header Cache-Control "no-store";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Application served under /web/
  location ^~ /web/ {
      try_files $uri $uri/ /index.html;
  }

  location /config.json {
    add_header Cache-Control "no-store";
  }

}
