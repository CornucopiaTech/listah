components:
  schemas:
    base64:
      type: boolean
      examples:
        - false
      title: base64
      description: Specifies if the message query param is base64 encoded, which may be required for binary data
    compression:
      examples:
        - gzip
      title: compression
      enum:
        - identity
        - gzip
        - br
      description: Which compression algorithm to use for this request
    connect:
      examples:
        - v1
      title: connect
      enum:
        - v1
      description: Define the version of the Connect protocol
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    encoding:
      examples:
        - json
      title: encoding
      enum:
        - proto
        - json
      description: Define which encoding or 'Message-Codec' to use
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    listah.v1.BadRequestDetails:
      type: object
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/listah.v1.ErrorCode'
          title: code
        fieldViolations:
          type: array
          items:
            $ref: '#/components/schemas/listah.v1.FieldViolation'
          title: field_violations
      title: BadRequestDetails
      additionalProperties: false
      description: The core payload we will attach to the error status
    listah.v1.ErrorCode:
      type: string
      title: ErrorCode
      enum:
        - ERROR_CODE_UNSPECIFIED
        - VALIDATION_FAILED
        - ALREADY_EXISTS
        - NOT_FOUND
        - UNAUTHORISED
        - INTERNAL_DATABASE_ERROR
      description: Machine-readable error codes for the frontend to switch on
    listah.v1.FieldViolation:
      type: object
      properties:
        field:
          type: string
          title: field
          description: e.g., "email"
        description:
          type: string
          title: description
          description: e.g., "This email is already registered."
      title: FieldViolation
      additionalProperties: false
      description: Custom detail for form validation or constraint violations
    listah.v1.Filter:
      type: object
      properties:
        id:
          type: string
          title: id
        userId:
          type: string
          title: user_id
        name:
          type: string
          title: name
        tags:
          type: array
          items:
            type: string
          title: tags
        count:
          type: integer
          title: count
          format: int32
        softDelete:
          type: boolean
          title: soft_delete
        updatedBy:
          type: string
          title: updated_by
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Filter
      additionalProperties: false
    listah.v1.InnerPropTagMap:
      type: object
      properties:
        value:
          type: object
          title: value
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/listah.v1.Tag'
            title: value
      title: InnerPropTagMap
      additionalProperties: false
    listah.v1.Item:
      type: object
      properties:
        id:
          type: string
          title: id
        userId:
          type: string
          title: user_id
        name:
          type: string
          title: name
        note:
          type: string
          title: note
        tags:
          type: array
          items:
            type: string
          title: tags
        props:
          type: object
          title: props
          additionalProperties:
            type: string
            title: value
        softDelete:
          type: boolean
          title: soft_delete
        tagObjs:
          type: array
          items:
            $ref: '#/components/schemas/listah.v1.Tag'
          title: tag_objs
        propObjs:
          type: array
          items:
            $ref: '#/components/schemas/listah.v1.MapObj'
          title: prop_objs
        suspension:
          type: integer
          title: suspension
          format: int32
        updatedBy:
          type: string
          title: updated_by
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Item
      additionalProperties: false
    listah.v1.ItemServiceReadFilterRequest:
      type: object
      properties:
        query:
          allOf:
            - $ref: '#/components/schemas/listah.v1.ReadQuery'
          title: query
        pagination:
