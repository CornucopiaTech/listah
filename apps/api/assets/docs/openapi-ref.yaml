          title: pagination
      title: ItemServiceReadFilterRequest
      additionalProperties: false
      description: Filter Messages
    listah.v1.ItemServiceReadFilterResponse:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/listah.v1.Filter'
          title: filters
        query:
