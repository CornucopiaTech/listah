name: Azure Administer K8 cluster
run-name: Azure Administer K8 cluster in ${{ vars.ROOT_NAME }} by @${{ github.actor }}
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  admin-cluster:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: "./deploy/terraform"
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation
    env:
      TF_VAR_root_name: ${{ vars.ROOT_NAME }}
      TF_VAR_app_name: ${{ vars.APP_NAME }}
      APP_NAME: ${{ vars.APP_NAME }}
      TF_VAR_location: ${{ vars.AZ_LOCATION }}
      TF_VAR_resource_group_name: ${{ vars.AZ_RESOURCE_GROUP_NAME }}
      TF_VAR_state_management_container_name: ${{ vars.AZ_STATE_MGT_CONTAINER_NAME }}
      TF_VAR_storage_account_name: ${{ vars.AZ_STORAGE_ACCT_NAME }}
      TF_VAR_environment: ${{ inputs.environment }}
      APP_ENV: ${{ inputs.environment }}
      TF_VAR_subscription_id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
      TF_VAR_state_management_key: azure/${{ inputs.environment }}
      TF_VAR_admin_group_id: ${{ secrets.AZ_ADMIN_GRP_ID }}
      TF_VAR_k8_cluster_name: "${{ vars.ROOT_NAME }}-k8-cluster-${{ inputs.environment }}-${{ vars.AZ_LOCATION }}"
      TF_VAR_k8_cluster_rg: "${{ vars.ROOT_NAME }}-k8-user-admin-rg-${{ inputs.environment }}-${{ vars.AZ_LOCATION }}"
      TF_VAR_k8_service_account_name: "${{ vars.ROOT_NAME }}-${{ vars.APP_NAME }}-sa"
      TF_VAR_k8_namespace: "${{ vars.APP_NAME }}"
      K8_SERVICE_ACCOUNT_NAME: "${{ vars.ROOT_NAME }}-${{ vars.APP_NAME }}-sa"
      K8_NAMESPACE: "${{ vars.APP_NAME }}"
      TF_VAR_vnet_name: "${{ vars.ROOT_NAME }}-vnet-${{ inputs.environment }}-${{ vars.AZ_LOCATION }}"
      TF_VAR_vnet_rg: "${{ vars.ROOT_NAME }}-k8-user-admin-rg-${{ inputs.environment }}-${{ vars.AZ_LOCATION }}"
      TF_VAR_subnet_name: "${{ vars.ROOT_NAME }}-k8-node-subnet-${{ inputs.environment }}-${{ vars.AZ_LOCATION }}"
      TF_LOG: INFO
      K8_STORAGE_CLASS: azure-storage-retained
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZ_GHA_TENANT_ID }}
          client-id: ${{ secrets.AZ_GHA_CLIENT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo $(az account show)
            # You can write your Azure CLI inline scripts here.

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"

      - name: Terraform Init, Set Env Vars
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.AZ_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.AZ_STORAGE_ACCT_NAME }}" \
            -backend-config="container_name=${{ vars.AZ_STATE_MGT_CONTAINER_NAME }}" \
            -backend-config="key=azure/${{ inputs.environment }}/${{ vars.APP_NAME }}/terraform.tfstate" \
            -var-file="${{ inputs.environment }}.tfvars" \

          echo "K8_MANAGED_IDENTITY_CLIENT_ID="$(terraform output -json app_identity | jq -r '.client_id')"" >> ${GITHUB_ENV}
          echo "AZ_VAULT_URI="$(terraform output -json app_vault | jq -r '.vault_uri')"" >> ${GITHUB_ENV}

      - name: Install Bootstrap K8
        run: |
          echo "In file path: $(pwd)"

          cd "${{ github.workspace }}/deploy/gitops/bootstrap"

          echo "In file path: $(pwd)"

          # bash bootstrap.bash

          # Install Apps
          cd "${{ github.workspace }}/deploy/gitops/apps"

          echo "In file path: $(pwd)"

          bash apps.bash
