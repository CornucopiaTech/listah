syntax = "proto3";
package listah.v1;

option go_package = "cornucopia/listah/internal/pkg/proto/v1";


import "google/protobuf/timestamp.proto";

// enum AuditUpdaterEnum {
//   AUDIT_UPDATER_ENUM_UNSPECIFIED = 0;
//   AUDIT_UPDATER_ENUM_FRONTEND = 1;
//   AUDIT_UPDATER_ENUM_SYSOPS = 2;
// }



message Tag {
  string id = 1;
  string user_id = 2;
  string name = 3;
  repeated string props = 4;
  int32 count = 5;
  bool soft_delete = 7;
  string updated_by = 500;
  google.protobuf.Timestamp updated_at = 501;
}

// message TagProperty1 {
//   string userId = 1;
//   string name = 2;
//   repeated Tag tagObjs = 3;
// }


message InnerPropTagMap {
  map<string,Tag> value = 1;
}

message MapObj {
  string key = 1;
  string value = 2;
}

message StringList {
  repeated string value = 1;
}

message TagPropertyMap {
  map<string,StringList> value = 1;
}
message Item {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string note = 4;
  repeated string tags = 5;
  map<string,string> props = 6;
  bool soft_delete = 7;
  repeated Tag tag_objs = 8;
  repeated MapObj prop_objs = 9;
  int32 suspension = 10;
  string updated_by = 500;
  google.protobuf.Timestamp updated_at = 501;
}

message Filter {
  string id = 1;
  string user_id = 2;
  string name = 3;
  repeated string tags = 4;
  int32 count = 5;
  bool soft_delete = 7;
  string updated_by = 500;
  google.protobuf.Timestamp updated_at = 501;
}

// message Search {
//   string text = 1;
//   repeated string tags = 2;
//   repeated string filters = 3;
// }


message Pagination {
  int64 size = 1;
  int64 page = 2;
  string sort = 3;
  int64 volume = 4;
}


message ReadQuery {
  string user_id = 1;
  string id = 2;
  repeated string tags = 3;
  string text = 4;
}

// message ReadReference {
//   Tag tag = 1;
//   Filter filter = 2;
// }

message ReadRequest {
  ReadQuery query = 500;
  Pagination pagination = 501;
}
